<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fountain of Life Student Photography | Fotografía de los Estudiantes</title>
  <style>
    :root { --bg: #f7f6f3; --fg: #1d1d1b; --muted: #6b6a66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111110; --fg: #f2f1ed; --muted: #a3a29d; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, sans-serif; text-align: center; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0 0 .5rem; }
    h2 { font-size: clamp(1.3rem, 4vw, 1.9rem); margin: 0 0 .5rem; }
    p { color: var(--muted); margin: .25rem 0; }
    .loc { color: var(--fg); font-weight: 500; }
    hr { width: 4rem; border: 0; border-top: 1px solid var(--muted); opacity: .4; margin: 1.75rem auto; }
  </style>
</head>
<body>
  <main>
    <section lang="en">
      <h1>Fountain of Life Student Photography</h1>
      <p class="loc">Juan Tomás, Dominican Republic</p>
      <p>Gallery coming soon.</p>
    </section>
    <hr>
    <section lang="es">
      <h2>Fotografía de los Estudiantes de Fountain of Life</h2>
      <p class="loc">Juan Tomás, República Dominicana</p>
      <p>Galería próximamente.</p>
    </section>
  </main>
</body>
</html>
